- name: Create TMOS Users
  f5networks.f5_modules.bigip_user:
    username_credential: "{{ item.username }}"
    password_credential: "{{ lookup('vars', item.password_var | string) }}"
    provider: "{{ provider }}"
    partition_access: "{{ item.partition_access }}"
    shell: "{{ item.shell }}"
    state: "{{ item.ansible_state }}"
  loop: "{{ GRPVAR_users | default([], true) }}"
  tags:
    - never
    - day0
    - extra-users

## Set some global settings- but not all DO system settings are available
- name: Set global settings
  f5networks.f5_modules.bigip_sys_global:
    gui_setup: false
    security_banner: true
    banner_text: "{{ system_config.login_banner }}"
    gui_audit: true
    provider: "{{ provider }}"
  tags:
    - global-settings

