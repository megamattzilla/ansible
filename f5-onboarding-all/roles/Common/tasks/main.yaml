- name: Set the hostname of the BIG-IP
  f5networks.f5_modules.bigip_hostname:
    hostname: "{{ HOSTVAR_hostname }}"
    provider: "{{ provider }}"
  tags:
    - hostname

- name: Set HTTPD Params
  f5networks.f5_modules.bigip_device_httpd:
    ssl_protocols: "{{ HTTPD_PROTOCOL_LIST }}"
    auth_pam_idle_timeout: "{{ HTTPD_IDLE_TIMEOUT }}"
    provider: "{{ provider }}"
  tags:
    - httpd

# Configure system DNS servers.
- name: Configure system DNS
  f5networks.f5_modules.bigip_device_dns:
    name_servers: "{{ dns_servers }}"              # List of DNS server IPs
    search: "{{ dns_domains }}"                # DNS search domains
    provider: "{{ provider }}"                # F5 API credentials and connection info
  tags:
    - dns


- name: Configure NTP
  f5networks.f5_modules.bigip_device_ntp:
    timezone: "{{ timezone }}" # Default timezone for F5 devices
    ntp_servers: "{{ ntp_servers | map(attribute='server') | list }}"              # List of NTP server IPs
    provider: "{{ provider }}"                # F5 API credentials and connection info
  tags:
    - ntp

- name: Create Self IP
  f5networks.f5_modules.bigip_selfip:
    address: "{{ item.address }}"
    name: "{{ item.name }}"
    netmask: "{{ item.netmask }}"
    vlan: "{{ item.vlan }}"
    traffic_group: "{{ item.traffic_group }}"
    provider: "{{ provider }}"
  loop: "{{ HOSTVAR_self_ips | default([], true) }}"
  tags:
    - self-ip

- name: Create TMOS route
  f5networks.f5_modules.bigip_static_route:
    destination: "{{ item.destination }}"
    netmask: "{{ item.netmask }}"
    name: "{{ item.name }}"
    gateway_address: "{{ item.gateway_address }}"
    provider: "{{ provider }}"
  loop: "{{ GRPVAR_routes | default([], true) }}"
  tags:
    - routes

## Save configuration before provisioning
- name: Save config
  f5networks.f5_modules.bigip_config:
    save: true
    provider: "{{ provider }}"

- name: Provision TMOS modules
  f5networks.f5_modules.bigip_provision:
    module: "{{ item.name }}"
    level: "{{ item.level }}"
    provider: "{{ provider }}"
  register: provision_result
  async: 45
  poll: 20
  retries: 3
  delay: 10
  until: provision_result is not failed
  loop: "{{ GRPVAR_modules }}"
  tags:
    - never
    - day0
    - provision-modules


- name: Update TMOS system DBs
  f5networks.f5_modules.bigip_sys_db:
    key: "{{ item.key }}"
    value: "{{ item.value }}"
    provider: "{{ provider }}"
  register: bigip_sys_db_result
  retries: 3
  delay: 20
  until: bigip_sys_db_result is not failed
  loop: "{{ GRPVAR_tmos_db | dict2items }}"
  tags:
    - never
    - day0
    - bigip_sys_db
